name: Build & Release EyeGuard APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true
      release_version:
        description: 'Release version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  validate_pr_and_ci:
    name: Build & Validate (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Validate Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

  production_release:
    name: Production Release Signing & Publish
    needs: [validate_pr_and_ci]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Validate Production Signing Secrets (Mandatory)
        run: |
          MISSING=""
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then MISSING="${MISSING} RELEASE_KEYSTORE_BASE64"; fi
          if [ -z "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ]; then MISSING="${MISSING} RELEASE_KEYSTORE_PASSWORD"; fi
          if [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]; then MISSING="${MISSING} RELEASE_KEY_ALIAS"; fi
          if [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then MISSING="${MISSING} RELEASE_KEY_PASSWORD"; fi
          
          if [ -n "$MISSING" ]; then
            echo "::error::Production release aborted! Required secrets missing:${MISSING}"
            exit 1
          fi
          echo "All production signing secrets verified."

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Clean Keystore
        if: always()
        run: rm -f /tmp/release.jks

      - name: Prepare APK Asset & Checksum
        id: apk_asset
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.release_version }}"
          fi
          if [[ -z "$VERSION" || "$VERSION" == "main" ]]; then
            VERSION="v1.4.1"
          fi
          
          mkdir -p dist
          APK_FILE="EyeGuard-${VERSION}.apk"
          SHA_FILE="EyeGuard-${VERSION}.apk.sha256"

          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_FILE}"
          cd dist
          sha256sum "${APK_FILE}" > "${SHA_FILE}"
          SHA_VALUE=$(awk '{print $1}' "${SHA_FILE}")
          cd ..

          echo "apk_path=dist/${APK_FILE}" >> $GITHUB_OUTPUT
          echo "sha_path=dist/${SHA_FILE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA_VALUE}" >> $GITHUB_OUTPUT

      - name: Upload APK & Checksum as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EyeGuard-${{ steps.apk_asset.outputs.version }}
          path: |
            ${{ steps.apk_asset.outputs.apk_path }}
            ${{ steps.apk_asset.outputs.sha_path }}
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_asset.outputs.version }}
          name: "EyeGuard ${{ steps.apk_asset.outputs.version }}"
          body: |
            ## 👁️ EyeGuard Android Release (${{ steps.apk_asset.outputs.version }})

            ### What's New:
            - **Target SDK 36 (Android 16)**: Updated to modern Android 16 platform standards.
            - **Offline-First Core**: All core eye protection routines run locally on the device without network dependencies.
            - **Health Care Content Updates**: Non-intrusive, read-only sync of updated eye-care tips without analytics or tracking.
            - **Mandatory Production Signing**: Signed with official reproducible credentials.

            ### Integrity & Verification:
            | Asset | SHA-256 Checksum |
            | :--- | :--- |
            | `EyeGuard-${{ steps.apk_asset.outputs.version }}.apk` | `${{ steps.apk_asset.outputs.sha256 }}` |

            ### 🔏 Production Certificate Fingerprint:
            | Algorithm | Fingerprint |
            | :--- | :--- |
            | **SHA-256** | `92:A9:F2:89:F8:FA:3B:AD:E6:6A:FC:28:E8:20:57:E1:CA:5C:30:E1:C5:F0:C3:A3:85:28:C6:44:02:AA:79:7F` |

            Verify download integrity via terminal:
            ```bash
            sha256sum -c EyeGuard-${{ steps.apk_asset.outputs.version }}.apk.sha256
            ```

            ### Installation:
            1. Download `EyeGuard-${{ steps.apk_asset.outputs.version }}.apk` below on your Android device.
            2. Tap to install (allow "Install unknown apps" if prompted).
            3. Grant the overlay and notification permissions to start protecting your eyes!
          files: |
            ${{ steps.apk_asset.outputs.apk_path }}
            ${{ steps.apk_asset.outputs.sha_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
