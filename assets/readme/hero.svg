<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1329"/>
      <stop offset="50%" style="stop-color:#0f1d33"/>
      <stop offset="100%" style="stop-color:#062322"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#152642;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0a192f;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative Tech Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Ambient Light Circles -->
  <circle cx="250" cy="200" r="180" fill="#10B981" opacity="0.08" filter="blur(40px)"/>
  <circle cx="950" cy="200" r="160" fill="#06B6D4" opacity="0.10" filter="blur(40px)"/>

  <!-- Left Side Content -->
  <g transform="translate(80, 85)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="370" height="30" rx="15" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="18" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34D399" font-weight="700" letter-spacing="2">ANDROID • OFFLINE-FIRST • DIGITAL WELLBEING</text>

    <!-- Main Title -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" fill="#ffffff" font-weight="800" letter-spacing="-1">Eye<tspan fill="url(#emerald)">Guard</tspan></text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">
      Protect your vision during long screen &amp; coding sessions.
    </text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748B" font-weight="400">
      Enforcing the 20-20-20 rule with non-intrusive, full-screen rest overlays.
    </text>

    <!-- Pills / Feature Chips -->
    <g transform="translate(0, 180)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="20" y="21" font-family="sans-serif" font-size="13" fill="#E2E8F0" font-weight="500">🛡️ 100% Offline</text>

      <!-- Chip 2 -->
      <rect x="145" y="0" width="135" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="162" y="21" font-family="sans-serif" font-size="13" fill="#E2E8F0" font-weight="500">🚫 Zero Ads &amp; AI</text>

      <!-- Chip 3 -->
      <rect x="295" y="0" width="145" height="32" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="312" y="21" font-family="sans-serif" font-size="13" fill="#E2E8F0" font-weight="500">⚡ Low Battery Use</text>
    </g>
  </g>

  <!-- Right Side Visual: Break Overlay Preview Card -->
  <g transform="translate(780, 50)" filter="url(#cardShadow)">
    <!-- Outer Phone/Card Frame -->
    <rect x="0" y="0" width="340" height="300" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Top Status / Time Indicator -->
    <circle cx="30" cy="30" r="6" fill="#10B981"/>
    <text x="46" y="34" font-family="sans-serif" font-size="12" fill="#94A3B8" font-weight="600">PROTECTION ACTIVE</text>
    <rect x="245" y="20" width="65" height="22" rx="6" fill="#10B981" fill-opacity="0.15"/>
    <text x="256" y="35" font-family="sans-serif" font-size="11" fill="#34D399" font-weight="700">20-20-20</text>

    <!-- Center Eye Icon & Countdown Display -->
    <g transform="translate(170, 140)">
      <!-- Outer Pulsing Ring -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="240 40" stroke-linecap="round" opacity="0.8"/>
      <circle cx="0" cy="0" r="44" fill="#0b192c"/>

      <!-- Eye SVG Icon -->
      <path d="M-18 -2 C-10 10 10 10 18 -2 C10 -14 -10 -14 -18 -2 Z" fill="none" stroke="#34D399" stroke-width="2.5"/>
      <circle cx="0" cy="-2" r="4" fill="#34D399"/>

      <!-- Timer Text -->
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">00:20</text>
    </g>

    <!-- Guidance message inside card -->
    <text x="170" y="225" font-family="sans-serif" font-size="13" fill="#E2E8F0" font-weight="500" text-anchor="middle">Look 20 feet away to relax your eyes</text>
    <text x="170" y="245" font-family="sans-serif" font-size="11" fill="#64748B" text-anchor="middle">به فاصله دور نگاه کنید تا چشمانتان استراحت کند</text>

    <!-- Bottom Action Pill Preview -->
    <rect x="45" y="260" width="250" height="24" rx="12" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="170" y="276" font-family="sans-serif" font-size="11" fill="#34D399" font-weight="600" text-anchor="middle">Overlay Closes When Timer Ends</text>
  </g>
</svg>
